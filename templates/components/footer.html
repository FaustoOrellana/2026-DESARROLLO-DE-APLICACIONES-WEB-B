<footer class="text-center py-4 py-md-5 mt-auto footer-custom bg-dark text-white-50 border-top border-secondary border-opacity-25">
    <div class="container-xl">
        <!-- Logo y Marca -->
        <div class="footer-logo mb-3 d-flex align-items-center justify-content-center gap-2">
            <img src="{{ url_for('static', filename='img/TechManager_Emblem.png') }}" 
                 alt="Logo TechManager" 
                 style="width: 28px; height: 28px; object-fit: contain;"
                 onerror="this.style.display='none'">
            <span class="fw-bold text-white fs-5 tracking-tight">
                {{ sistema.nombre_sistema if sistema else 'TechManager' }}
            </span>
        </div>

        <!-- Créditos del Proyecto -->
        <p class="mb-1 fw-medium text-white-50 small">
            Desarrollado por: <span class="text-white fw-semibold">Fausto Orellana</span>
        </p>
        <p class="mb-3 text-white-50 position-relative d-inline-block small">
            Desarrollo de Aplicaciones Web (B)
        </p>

        <!-- Separador sutil -->
        <hr class="my-3 mx-auto text-white-50 opacity-25" style="max-width: 280px;">

        <!-- Copyright dinámico -->
        <p class="mb-0 small text-white-50">
            © {{ sistema.periodo if (sistema and sistema.periodo) else 2026 }} Todos los derechos reservados • Conectividad Eficiente
        </p>
    </div>
</footer>
